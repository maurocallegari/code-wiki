<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11130f">
  <title>Code Wiki · Mauro</title>
  <style>
    /* Hallmark · macrostructure: Index-First · theme: Terminal · nav: N3 · footer: Ft1
     * contrast: pass (40–41) · slop: pass (42–45) · honest: pass (46)
     * chrome: pass (47) · tokens: pass (48) · mobile: pass (34, 49–57) */
    :root{--paper:oklch(14% .012 95);--paper-2:oklch(18% .014 95);--paper-3:oklch(23% .014 95);--ink:oklch(94% .012 95);--muted:oklch(73% .018 95);--rule:oklch(32% .018 95);--accent:oklch(82% .16 82);--danger:oklch(70% .18 28);--tip:oklch(76% .13 145);--accent-ink:oklch(16% .02 82);--focus:oklch(88% .17 82);--display:Charter,"Bitstream Charter","Iowan Old Style",serif;--body:"Aptos","Segoe UI",sans-serif;--mono:"SFMono-Regular",Menlo,Monaco,monospace;--nav:17.5rem}
    *{box-sizing:border-box}html{background:var(--paper);color:var(--ink);scroll-behavior:smooth}body{margin:0;font:17px/1.62 var(--body);min-height:100vh}button,input{font:inherit}a{color:var(--accent);text-underline-offset:.2em}a:hover{text-decoration-thickness:.13em}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
    .skip{position:fixed;left:.75rem;top:-5rem;background:var(--accent);color:var(--accent-ink);padding:.65rem 1rem;z-index:50}.skip:focus{top:.75rem}.menu{display:none;position:fixed;top:max(.75rem,env(safe-area-inset-top));left:.75rem;z-index:30;min-width:44px;min-height:44px;border:1px solid var(--rule);background:var(--paper-2);color:var(--ink);cursor:pointer}.backdrop{display:none}
    aside{position:fixed;inset:0 auto 0 0;width:var(--nav);padding:2rem 1.25rem calc(2rem + env(safe-area-inset-bottom));background:var(--paper-2);border-right:1px solid var(--rule);overflow:auto;z-index:20}.brand{display:block;color:var(--ink);font:700 1.45rem/1 var(--display);text-decoration:none;margin:.15rem 0 .55rem}.tagline{color:var(--muted);font-size:.88rem;margin:0 0 1.5rem}.search{width:100%;min-height:44px;padding:.7rem .8rem;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:0;outline:2px solid transparent}.search:focus{border-color:var(--accent)}nav ul{list-style:none;padding:0;margin:1.25rem 0}nav li{margin:.1rem 0}nav a{display:block;min-height:42px;padding:.55rem .6rem;color:var(--muted);text-decoration:none;white-space:nowrap;border-left:3px solid transparent}nav a:hover,nav a[aria-current="page"]{color:var(--ink);background:var(--paper-3);border-left-color:var(--accent)}nav .section{margin-top:1rem;color:var(--accent);font:700 .72rem/1.4 var(--mono);letter-spacing:.09em;text-transform:uppercase;padding:.45rem .6rem}
    main{margin-left:var(--nav);width:min(100% - var(--nav),76rem);padding:clamp(2.25rem,5vw,5rem) clamp(1.25rem,5vw,5.5rem) 7rem}.doc{max-width:70ch}.doc>h1:first-child{margin-top:0;font:700 clamp(2.35rem,6vw,4.9rem)/1.03 var(--display);letter-spacing:-.035em;overflow-wrap:anywhere;min-width:0}.doc h2{margin-top:2.5em;font:700 clamp(1.55rem,3vw,2.25rem)/1.12 var(--display);overflow-wrap:anywhere;min-width:0}.doc h3{margin-top:1.8em;font:700 1.18rem/1.25 var(--body)}.doc p,.doc li{max-width:68ch}.doc hr{border:0;border-top:1px solid var(--rule);margin:2.5rem 0}.doc code{font-family:var(--mono);font-size:.88em;color:var(--accent);overflow-wrap:anywhere}.doc pre{margin:1.35rem 0;padding:1rem;overflow:auto;background:var(--paper-2);border:1px solid var(--rule);-webkit-overflow-scrolling:touch}.doc pre code{color:var(--ink);overflow-wrap:normal}.doc table{display:block;width:100%;overflow:auto;border-collapse:collapse;-webkit-overflow-scrolling:touch}.doc th,.doc td{padding:.65rem .8rem;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}.doc th{color:var(--accent);font-family:var(--mono);font-size:.83rem}.doc blockquote{margin:1.5rem 0;padding:.85rem 1rem;border-left:4px solid var(--rule);background:var(--paper-2)}.doc blockquote p{margin:.2rem 0}.doc blockquote[data-kind="danger"]{border-color:var(--danger)}.doc blockquote[data-kind="warn"]{border-color:var(--accent)}.doc blockquote[data-kind="tip"]{border-color:var(--tip)}.doc ul,.doc ol{padding-left:1.3rem}.loading{color:var(--muted)}.error{border-left:4px solid var(--danger);padding:1rem;background:var(--paper-2)}footer{margin-top:5rem;padding-top:1rem;border-top:1px solid var(--rule);color:var(--muted);font-size:.85rem}
    @media(max-width:760px){.menu{display:block}.backdrop.open{display:block;position:fixed;inset:0;background:var(--paper);opacity:.72;z-index:15}aside{transform:translateX(-102%);transition:transform .18s ease;padding-top:4.6rem;width:min(88vw,20rem)}aside.open{transform:none}main{margin-left:0;width:100%;padding:5.25rem 1rem calc(5rem + env(safe-area-inset-bottom))}.doc>h1:first-child{font-size:clamp(2.2rem,12vw,3.35rem)}.doc table{font-size:.92rem}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}aside{transition:none}}
  </style>
</head>
<body>
  <a class="skip" href="#content">Vai al contenuto</a>
  <button class="menu" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Apri navigazione">☰</button>
  <div class="backdrop" aria-hidden="true"></div>
  <aside id="sidebar"><a class="brand" href="#/README">Code Wiki</a><p class="tagline">Il banco di lavoro AI di Mauro.</p><input class="search" type="search" placeholder="Filtra pagine…" aria-label="Filtra pagine"><nav aria-label="Indice"><ul id="nav"></ul></nav></aside>
  <main id="content" tabindex="-1"><article class="doc"><p class="loading">Apro il quaderno…</p></article><footer>Stealth Software · Treviso · manuale operativo locale</footer></main>
  <script>
  (()=>{'use strict';
    const pages=[['Inizia','README','Start Here'],['Metodo','metodo','Il Metodo'],['Metodo','stile','Il mio stile'],['Setup','setup-hermes','Hermes'],['Setup','setup-codex','Codex'],['Setup','best-practices','Best Practices 2026'],['Setup','creating-skills','Creare skill'],['Tutorial','tutorial-fix-bug','Fix bug STH'],['Tutorial','tutorial-new-feature','Feature Insta'],['Tutorial','tutorial-batch','Batch T2'],['Operazioni','import','Importare repo'],['Operazioni','kanban','Kanban'],['Operazioni','deploy','Deploy FTP'],['Riferimento','problemi','Problemi comuni'],['Riferimento','cheatsheet','Cheat Sheet']];
    const nav=document.querySelector('#nav'),article=document.querySelector('.doc'),aside=document.querySelector('aside'),menu=document.querySelector('.menu'),backdrop=document.querySelector('.backdrop'),search=document.querySelector('.search');
    let group=''; pages.forEach(([g,id,label])=>{if(g!==group){group=g;const li=document.createElement('li');li.className='section';li.textContent=g;nav.append(li)}const li=document.createElement('li'),a=document.createElement('a');a.href='#/'+id;a.dataset.page=id;a.textContent=label;li.append(a);nav.append(li)});
    const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    function inline(s){return s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,t,u)=>'<a href="'+(u.endsWith('.md')?'#/'+u.slice(0,-3):u)+'">'+t+'</a>')}
    function md(src){
      const out=[]; let code=false,lang='',buf=[],list='',table=false,header=true;
      const close=()=>{if(list){out.push('</'+list+'>');list=''}if(table){out.push('</tbody></table>');table=false;header=true}};
      for(const raw of src.replace(/\r/g,'').split('\n')){
        const isTable=raw.includes('|')&&raw.trim().startsWith('|');
        if(table&&!isTable)close();
        if(raw.startsWith('```')){if(code){out.push('<pre><code data-lang="'+esc(lang)+'">'+esc(buf.join('\n'))+'</code></pre>');code=false;buf=[]}else{close();code=true;lang=raw.slice(3).trim()}continue}
        if(code){buf.push(raw);continue} if(!raw.trim()){close();continue}
        let m;
        if((m=raw.match(/^(#{1,3})\s+(.+)/))){close();const n=m[1].length;out.push('<h'+n+'>'+inline(m[2])+'</h'+n+'>')}
        else if(/^---+$/.test(raw)){close();out.push('<hr>')}
        else if((m=raw.match(/^>\s*(?:\[!(DANGER|WARNING|TIP)\]\s*)?(.*)/i))){close();out.push('<blockquote'+(m[1]?' data-kind="'+(m[1].toLowerCase()==='warning'?'warn':m[1].toLowerCase())+'"':'')+'><p>'+inline(m[2])+'</p></blockquote>')}
        else if((m=raw.match(/^[-*]\s+(.+)/))){if(list!=='ul'){close();list='ul';out.push('<ul>')}out.push('<li>'+inline(m[1])+'</li>')}
        else if((m=raw.match(/^\d+\.\s+(.+)/))){if(list!=='ol'){close();list='ol';out.push('<ol>')}out.push('<li>'+inline(m[1])+'</li>')}
        else if(isTable){const cells=raw.trim().slice(1,-1).split('|').map(x=>x.trim());if(cells.every(x=>/^:?-+:?$/.test(x))){header=false;continue}if(!table){close();table=true;header=true;out.push('<table><thead>')}if(header){out.push('<tr>'+cells.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>')}else{out.push('<tr>'+cells.map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>')}}
        else{close();out.push('<p>'+inline(raw)+'</p>')}
      }
      close(); return out.join('\n');
    }
    function toggle(open){aside.classList.toggle('open',open);backdrop.classList.toggle('open',open);menu.setAttribute('aria-expanded',String(open))}menu.addEventListener('click',()=>toggle(!aside.classList.contains('open')));backdrop.addEventListener('click',()=>toggle(false));
    search.addEventListener('input',()=>{const q=search.value.toLowerCase();nav.querySelectorAll('a').forEach(a=>a.parentElement.hidden=!a.textContent.toLowerCase().includes(q))});
    async function load(){const id=(location.hash.match(/^#\/([^?]+)/)||[])[1]||'README';if(!pages.some(p=>p[1]===id)){location.hash='#/README';return}nav.querySelectorAll('a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.page===id));article.innerHTML='<p class="loading">Apro il quaderno…</p>';try{const r=await fetch(id+'.md',{cache:'no-store'});if(!r.ok)throw Error(r.status+' '+r.statusText);article.innerHTML=md(await r.text());document.title=(pages.find(p=>p[1]===id)||[])[2]+' · Code Wiki';scrollTo(0,0);toggle(false)}catch(e){article.innerHTML='<div class="error"><strong>Pagina non caricata.</strong><p>Avvia un server locale: <code>python3 -m http.server 8000</code>, poi apri <code>http://localhost:8000</code>.</p></div>'}}window.addEventListener('hashchange',load);load();
  })();
  </script>
</body>
</html>
